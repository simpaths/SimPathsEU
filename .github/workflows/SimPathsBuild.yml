# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Build and run SimPaths

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: [ ubuntu-latest ]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 19
      uses: actions/setup-java@v4
      with:
        java-version: '19'
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - uses: actions/upload-artifact@v4
      with:
        name: simpaths_jars
        path: ./*.jar

  run-integration-tests:
    runs-on: [ ubuntu-latest ]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 19
      uses: actions/setup-java@v4
      with:
        java-version: '19'
        distribution: 'temurin'
    - name: Run integration tests
      run: mvn verify
    - name: Upload Actual CSVs for Inspection
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: actual-simulation-results
        # One folder per country. Default if-no-files-found: warn is wanted here —
        # no output at all means the run died before simulating.
        path: |
          output/INTEGRATION_TESTS_TRAINING_PL/csv/
          output/INTEGRATION_TESTS_TRAINING_ES/csv/
